<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quotesy Icon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --icon-size: min(86vmin, 760px);
            --corner-radius: 0;
            --bg-top: #050505;
            --bg-bottom: #050505;
            --edge-inner: rgba(210, 216, 224, 0.18);
            --white: #ffffff;
            --gold: #b8860b;
            --text-shadow: rgba(0, 0, 0, 0.58);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            background: #0c0e12;
        }

        body {
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: "Playfair Display", Georgia, "Times New Roman", serif;
        }

        .icon {
            position: relative;
            width: var(--icon-size);
            aspect-ratio: 1;
            border-radius: var(--corner-radius);
            overflow: hidden;
            display: grid;
            place-items: center;
            padding: 0 7%;
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            box-shadow:
                inset 0 0 0 1px var(--edge-inner),
                inset 0 1px 0 rgba(255, 255, 255, 0.12),
                0 20px 45px rgba(0, 0, 0, 0.42);
            isolation: isolate;
        }

        .icon::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 50%;
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, 0.26) 0%,
                    rgba(255, 255, 255, 0.12) 36%,
                    rgba(255, 255, 255, 0) 100%);
            border-radius: 0 0 50% 50% / 0 0 22% 22%;
            z-index: 1;
            pointer-events: none;
        }

        .wordmark {
            position: relative;
            z-index: 2;
            margin: 0;
            width: 100%;
            line-height: 1;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.01em;
            font-size: clamp(34px, 11.5vw, 132px);
            white-space: nowrap;
            text-align: center;
            text-shadow: 0 1px 2px var(--text-shadow);
            transform: translateY(0);
            user-select: none;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        .wordmark .light {
            color: var(--white);
        }

        .wordmark .gold {
            color: var(--gold);
        }
    </style>
</head>

<body>
    <div class="icon" role="img" aria-label="Quotesy icon">
        <h1 class="wordmark" aria-hidden="true">
            <span class="light">QUOT</span><span class="gold">ESY</span>
        </h1>
    </div>
</body>

</html>
