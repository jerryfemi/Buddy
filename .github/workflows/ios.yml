name: Build iOS IPA
on:
  workflow_dispatch: # This allows you to run it manually from the website

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Disable code signing in Xcode project
        run: |
          cd ios
          sed -i '' 's/DEVELOPMENT_TEAM = .*;/DEVELOPMENT_TEAM = "";/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = ".*"/CODE_SIGN_IDENTITY = ""/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = ".*"/PROVISIONING_PROFILE_SPECIFIER = ""/g' Runner.xcodeproj/project.pbxproj

      - name: Build IPA (No Signature)
        run: |
          flutter build ios --release --no-codesign 2>&1 || true
          
          # Since Flutter crashes on its own signing check, it fails to copy the app to the final folder.
          # But the Xcode build succeeded, so Runner.app exists in the intermediate build folders.
          echo "Searching for generated Runner.app..."
          APP_PATH=$(find build/ios -name "Runner.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Runner.app was not generated anywhere. Build failed."
            exit 1
          fi
          
          echo "Found Runner.app at: $APP_PATH"
          
          # Package the IPA
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r app.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: app.ipa
